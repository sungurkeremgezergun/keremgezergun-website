name: Promote to production

# The VPS is not reachable from GitHub's runners (every SSH deploy timed out),
# so deploys are pull-based: when CI passes on main, this job fast-forwards
# the `production` branch and the server's timer (deploy/pull.sh) picks it up
# within a few minutes.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  promote:
    name: Fast-forward production
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Push main to production
        run: git push origin main:production
